---
name: ZPC Docker publish

on:
  push:
    branches:
      - main
    paths:
      - ci/docker/**
      - ci/dependencies/**
      - .github/workflows/docker-publish.yml
  pull_request:
    paths:
      - ci/docker/**
      - ci/dependencies/**
      - .github/workflows/docker-publish.yml
  workflow_run:
    workflows:
      - ZPC Release
    types:
      - completed

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve mode
        run: |
          case "${{ github.event_name }}" in
            workflow_run)
              echo "MODE=release" >> "$GITHUB_ENV"
              echo "REF=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
              ;;
            push)
              echo "MODE=main" >> "$GITHUB_ENV"
              echo "REF=${{ github.sha }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "MODE=pr" >> "$GITHUB_ENV"
              echo "REF=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/zpc" >> "$GITHUB_ENV"

      - name: Build zpc-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          target: zpc-test
          platforms: linux/amd64
          push: false

      - name: Set image tags
        if: env.MODE == 'main' || env.MODE == 'release'
        run: |
          if [ "$MODE" = "release" ]; then
            tag=$(git tag -l 'zpc-v*' --points-at HEAD | head -1)
            if [ -z "$tag" ]; then
              echo "::error title=Missing release tag::No zpc-v* tag found at HEAD"
              exit 1
            fi
            semver="${tag#zpc-v}"
            tags="${IMAGE}:${tag},${IMAGE}:${semver}"
          else
            tags="${IMAGE}:main"
          fi
          echo "TAGS=${tags}" >> "$GITHUB_ENV"
        env:
          MODE: ${{ env.MODE }}
          IMAGE: ${{ env.IMAGE }}

      - name: Log in to GitHub Container Registry
        if: env.MODE == 'main' || env.MODE == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push zpc-dev image
        if: env.MODE == 'main' || env.MODE == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          target: zpc-dev
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}
