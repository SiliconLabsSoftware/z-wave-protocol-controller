#
# Native Linux sanitizer builds of zpc: ASan+UBSan (debug-sanitize) and TSan
# (debug-tsan) on amd64 and arm64. Packages a .deb. Manual run and Mon/Thu
# schedule. Not a PR merge gate.
---
name: ZPC Sanitizer

on:
  schedule:
    - cron: "0 5 * * 1,4"
  workflow_dispatch:

concurrency:
  group: zpc-sanitize-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  debug_sanitize:
    name: ${{ matrix.preset }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [debug-sanitize, debug-tsan]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    env:
      CC: gcc-14
      CXX: g++-14
      CMAKE_INSTALL_PREFIX: /usr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/setup-linux-deps
        with:
          package_lists: ci/dependencies/apt-packages-base.txt
          pip_requirements: "true"

      - name: Configure and build ${{ matrix.preset }} zpc
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Package ZPC
        run: cpack --preset ${{ matrix.preset }}

      - name: Upload ZPC debian package
        uses: actions/upload-artifact@v4
        with:
          name: zpc-deb-${{ matrix.arch }}-gcc-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/*.deb
          retention-days: 1
          if-no-files-found: error
