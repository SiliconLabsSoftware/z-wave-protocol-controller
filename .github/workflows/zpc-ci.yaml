---
name: ZPC CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Use ubuntu-26 because of the clang-format-19.1.7
    env:
      CLANG_FORMAT: clang-format-19
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/setup-linux-deps
        with:
          package_lists: ci/dependencies/apt-packages-clang-format.txt

      - name: Check clang-format
        run: ./ci/scripts/clang-format.sh check

  unit_test:
    name: unit-test
    needs: [format]
    if: needs.format.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/setup-linux-deps
        with:
          package_lists: ci/dependencies/apt-packages-base.txt
          pip_requirements: "true"
          extra_packages: clang-17

      - name: Add gcc unit tests header for summary
        run: echo "### Unit tests (gcc)" >> $GITHUB_STEP_SUMMARY

      - name: Configure, build, and run unit tests (gcc)
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --workflow --preset unit-test

      - name: Collect gcc test report
        if: always()
        run: |
          mkdir -p unit-test-reports
          cp build/unit-test/test-results.xml unit-test-reports/gcc-test-results.xml

      - name: Test Summary for gcc unit tests
        if: always()
        uses: test-summary/action@v2
        with:
          paths: unit-test-reports/gcc-test-results.xml

      - name: Add clang unit tests header for summary
        run: echo "### Unit tests (clang)" >> $GITHUB_STEP_SUMMARY

      - name: Configure, build, and run unit tests (clang)
        env:
          CC: clang-17
          CXX: clang++-17
        run: cmake --workflow --preset unit-test --fresh

      - name: Collect clang test report
        if: always()
        run: |
          mkdir -p unit-test-reports
          cp build/unit-test/test-results.xml unit-test-reports/clang-test-results.xml

      - name: Test Summary for clang unit tests
        if: always()
        uses: test-summary/action@v2
        with:
          paths: unit-test-reports/clang-test-results.xml

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: unit-test-reports/
          retention-days: 1
          if-no-files-found: error

  clang_tidy:
    name: clang-tidy
    needs: [format, unit_test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/setup-linux-deps
        with:
          package_lists: ci/dependencies/apt-packages-base.txt ci/dependencies/apt-packages-clang-tidy.txt
          pip_requirements: "true"

      - name: Configure and run clang-tidy
        run: ./ci/scripts/clang-tidy.sh check

  build_linux:
    name: build-linux
    needs: [format, unit_test]
    if: needs.format.result == 'success' && needs.unit_test.result == 'success'
    uses: ./.github/workflows/zpc-build-linux.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  build_macos:
    name: macos-amd64-clang
    needs: [format, unit_test]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install $(cat ci/dependencies/brew-packages.txt)
          pip3 install -r ci/dependencies/requirements.txt --break-system-packages

      - name: Build ZPC
        run: cmake --workflow --preset macos

  success:
    name: success
    needs: [format, unit_test, clang_tidy, build_linux, build_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Enforce required job outcomes
        run: |
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "::error title=CI gate::format was '${{ needs.format.result }}' (expected success)"
            exit 1
          fi
          if [ "${{ needs.unit_test.result }}" != "success" ]; then
            echo "::error title=CI gate::unit_test was '${{ needs.unit_test.result }}' (expected success)"
            exit 1
          fi
          if [ "${{ needs.clang_tidy.result }}" != "success" ]; then
            echo "::error title=CI gate::clang_tidy was '${{ needs.clang_tidy.result }}' (expected success)"
            exit 1
          fi
          if [ "${{ needs.build_linux.result }}" != "success" ]; then
            echo "::error title=CI gate::build was '${{ needs.build_linux.result }}' (expected success)"
            exit 1
          fi
          if [ "${{ needs.build_macos.result }}" != "success" ]; then
            echo "::error title=CI gate::build_macos was '${{ needs.build_macos.result }}' (expected success)"
            exit 1
          fi
